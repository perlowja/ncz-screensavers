[preset]
name=Microquasar (Cygnus X-1)
description=A stellar-mass black hole pulling a stream of gas off a blue supergiant companion into a small hot disk, with a faint jet. Modeled on Cygnus X-1.
accuracy=artistic
sources=Miller-Jones et al 2021 (black hole 21.2 solar masses, spin above 0.9, inclination about 27 degrees, distance 2.2 kpc); companion HDE 226868, a 40.6 solar mass O9.7 supergiant, orbital period 5.6 days. The real system is wind fed; the stream is drawn for effect, and the star and stream are not lensed.
[blackhole]
palette=faithful
flyby=slow-orbit
distance-min=32
distance-max=36
inclination=63
spin=0.98
disk-outer=14
disk-brightness=1.2
companion=1
jet=0.6
jet-length=30
bloom=0.6
nebula=0.3
speed=0.6
